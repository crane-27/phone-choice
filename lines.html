<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品线地图 · 从零开始的手机选购指南</title>
<meta name="description" content="按需求分组或按价位分档浏览手机产品线，支持品牌与关键词筛选。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="lines">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="eyebrow">第二步 / 4</div>
      <h1>锁定型号</h1>
      <p class="lede">先根据需求确定可以考虑的产品线，再在产品线里挑具体型号。下面的分类是粗粒度的，筛选时不要严格按表执行。</p>
    </div>

    <div class="brand-bar">
      <span class="filter-label">品牌官网</span>
      <div class="brand-links">
        <a href="https://consumer.huawei.com/cn/" target="_blank" rel="noopener">华为 ↗</a>
        <a href="https://www.mi.com/" target="_blank" rel="noopener">小米 ↗</a>
        <a href="https://www.mi.com/redmi" target="_blank" rel="noopener">红米 ↗</a>
        <a href="https://www.oppo.com/cn/" target="_blank" rel="noopener">OPPO ↗</a>
        <a href="https://www.oneplus.com/cn" target="_blank" rel="noopener">一加 ↗</a>
        <a href="https://www.vivo.com.cn/" target="_blank" rel="noopener">vivo ↗</a>
        <a href="https://www.iqoo.com/" target="_blank" rel="noopener">iQOO ↗</a>
        <a href="https://www.honor.com/cn/" target="_blank" rel="noopener">荣耀 ↗</a>
        <a href="https://www.apple.com.cn/" target="_blank" rel="noopener">苹果 ↗</a>
      </div>
      <span class="small muted brand-hint">查参数用官网，到手价看京东 / 天猫官方旗舰店</span>
    </div>

    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">需求</span>
        <div id="need-chips" class="filter-row"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">价位</span>
        <div id="tier-chips" class="filter-row"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">品牌</span>
        <select id="brand-select" aria-label="按品牌筛选">
          <option value="">全部</option>
        </select>
        <input type="search" id="search" placeholder="搜索系列 / 示例机型" aria-label="搜索">
        <select id="view-select" aria-label="视图">
          <option value="need">按需求分组</option>
          <option value="tier">按价位分档</option>
        </select>
        <button class="btn btn-ghost btn-sm" type="button" id="clear-filters">清除筛选</button>
      </div>
      <div class="small muted" id="count" style="margin-left:auto"></div>
    </div>

    <div id="groups"></div>

    <div class="note">
      <strong>别只看表：</strong>这些分类都是比较粗粒度的，部分机型可能处于错误的分类。同时应当关注能力超出你需求的产品线，因为那里可能存在适合你的减配款或老款。“买新不买旧”并不总是成立。
    </div>

    <div class="pager">
      <a href="needs.html"><span class="dir">上一步</span>需求诊断</a>
      <a class="next" href="compare.html"><span class="dir">下一步</span>货比三家 →</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const { param, esc } = window.App;
  const { NEEDS, TIERS, LINES, BRANDS } = window.GUIDE;

  const needById = Object.fromEntries(NEEDS.map((n) => [n.id, n]));
  const tierById = Object.fromEntries(TIERS.map((t) => [t.id, t]));

  const state = {
    needs: new Set(),
    tiers: new Set(),
    brand: "",
    q: "",
    view: "need",
  };

  const needChips = document.getElementById("need-chips");
  const tierChips = document.getElementById("tier-chips");
  const brandSelect = document.getElementById("brand-select");
  const searchInput = document.getElementById("search");
  const viewSelect = document.getElementById("view-select");
  const groups = document.getElementById("groups");
  const count = document.getElementById("count");

  // 初始化控件
  needChips.innerHTML = NEEDS.map(
    (n) => `<button class="chip" type="button" data-need="${n.id}" aria-pressed="false">${esc(n.short)}</button>`
  ).join("");
  tierChips.innerHTML = TIERS.map(
    (t) => `<button class="chip" type="button" data-tier="${t.id}" aria-pressed="false">${esc(t.name)}</button>`
  ).join("");
  brandSelect.innerHTML =
    '<option value="">全部</option>' +
    BRANDS.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join("");

  // URL 预选（从需求诊断跳转而来）
  const urlNeeds = (param("need") || "").split(",").filter(Boolean);
  const urlTier = param("tier") || "";
  urlNeeds.forEach((n) => {
    if (needById[n]) state.needs.add(n);
  });
  if (tierById[urlTier]) state.tiers.add(urlTier);

  function syncChips() {
    needChips.querySelectorAll("[data-need]").forEach((b) => {
      b.setAttribute("aria-pressed", state.needs.has(b.dataset.need) ? "true" : "false");
    });
    tierChips.querySelectorAll("[data-tier]").forEach((b) => {
      b.setAttribute("aria-pressed", state.tiers.has(b.dataset.tier) ? "true" : "false");
    });
    brandSelect.value = state.brand;
    searchInput.value = state.q;
    viewSelect.value = state.view;
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return LINES.filter((l) => {
      if (state.needs.size && !l.needs.some((n) => state.needs.has(n))) return false;
      if (state.tiers.size && !l.tiers.some((t) => state.tiers.has(t))) return false;
      if (state.brand && l.brand !== state.brand) return false;
      if (q) {
        const hay = [l.brand, l.name, l.example, l.limit || ""].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function card(l) {
    return `
      <article class="card line-card">
        <div class="line-head">
          <span class="brand">${esc(l.brand)}</span>
          <span class="tag">${esc(tierById[l.tiers[0]] ? tierById[l.tiers[0]].name : "")}</span>
        </div>
        <h3>${esc(l.name)}</h3>
        <p class="example">如：${esc(l.example)}</p>
        ${l.limit ? `<p class="limit">限定：${esc(l.limit)}</p>` : ""}
        <div class="tags">
          ${l.needs
            .map((n) => `<span class="tag tag-accent">${esc(needById[n] ? needById[n].short : n)}</span>`)
            .join("")}
        </div>
      </article>`;
  }

  function render() {
    const rows = filtered();
    count.textContent = `共 ${rows.length} 条产品线`;
    syncURL();

    if (!rows.length) {
      groups.innerHTML = `<div class="card center" style="padding:3rem 1rem"><p class="mb-0 muted">没有符合当前筛选条件的产品线。</p></div>`;
      return;
    }

    let html = "";
    if (state.view === "need") {
      NEEDS.forEach((n) => {
        const subset = rows.filter((l) => l.needs.includes(n.id));
        if (!subset.length) return;
        html += `
          <section class="group-block">
            <div class="group-title"><h2>${esc(n.title)}</h2><span class="tag">${subset.length}</span></div>
            <p class="group-desc">${esc(n.desc)}</p>
            <div class="line-grid">${subset.map(card).join("")}</div>
          </section>`;
      });
    } else {
      TIERS.forEach((t) => {
        const subset = rows.filter((l) => l.tiers.includes(t.id));
        if (!subset.length) return;
        html += `
          <section class="group-block">
            <div class="group-title"><h2>${esc(t.name)}</h2><span class="tag">${esc(t.range)}</span><span class="tag">${esc(t.advice)}</span></div>
            <p class="group-desc">${esc(t.desc)}</p>
            <div class="line-grid">${subset.map(card).join("")}</div>
          </section>`;
      });
    }
    groups.innerHTML = html;
  }

  function syncURL() {
    const params = new URLSearchParams();
    if (state.needs.size) params.set("need", Array.from(state.needs).join(","));
    if (state.tiers.size === 1) params.set("tier", Array.from(state.tiers)[0]);
    const qs = params.toString();
    try {
      history.replaceState(null, "", qs ? "?" + qs : location.pathname);
    } catch (e) {
      /* file:// 等环境可能不允许修改地址栏，忽略 */
    }
  }

  needChips.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-need]");
    if (!btn) return;
    const id = btn.dataset.need;
    if (state.needs.has(id)) state.needs.delete(id);
    else state.needs.add(id);
    syncChips();
    render();
  });

  tierChips.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-tier]");
    if (!btn) return;
    const id = btn.dataset.tier;
    if (state.tiers.has(id)) state.tiers.delete(id);
    else state.tiers.add(id);
    syncChips();
    render();
  });

  brandSelect.addEventListener("change", function () {
    state.brand = brandSelect.value;
    render();
  });

  searchInput.addEventListener(
    "input",
    window.App.debounce(function () {
      state.q = searchInput.value;
      render();
    }, 180)
  );

  viewSelect.addEventListener("change", function () {
    state.view = viewSelect.value;
    render();
  });

  document.getElementById("clear-filters").addEventListener("click", function () {
    state.needs.clear();
    state.tiers.clear();
    state.brand = "";
    state.q = "";
    syncChips();
    render();
  });

  syncChips();
  render();
})();
</script>
</body>
</html>
